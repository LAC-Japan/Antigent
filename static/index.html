<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antigent Console</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #070b16;
  --bg2: #0c1324;
  --panel: #0f172b;
  --panel2: #131d36;
  --line: #22304f;
  --text: #e6ecf8;
  --muted: #8a98b8;
  --antigen: #ff5c7a;          /* attacker = antigen */
  --antigen-soft: rgba(255, 92, 122, .12);
  --antibody: #38d9c4;         /* Antigent = antibody */
  --antibody-soft: rgba(56, 217, 196, .12);
  --warn: #f4b740;
  --ok: #5fd38a;
  --bad: #ff6b6b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Inter", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(255, 92, 122, .08), transparent 60%),
    radial-gradient(1200px 600px at 90% -10%, rgba(56, 217, 196, .08), transparent 60%),
    var(--bg);
  color: var(--text); font: 17px/1.5 var(--sans);
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 18px; padding: 10px 18px;
  border-bottom: 1px solid var(--line); background: rgba(12, 19, 36, .85); flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-size: 30px; letter-spacing: .01em; font-weight: 700; }
.brand h1 .a { color: var(--antigen); } .brand h1 .b { color: var(--antibody); }
.brand small { display: block; color: var(--muted); font-size: 14px; letter-spacing: .04em; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.kv { display: flex; flex-direction: column; line-height: 1.2; }
.kv span:first-child { color: var(--muted); font-size: 14px; letter-spacing: .08em; }
.kv span:last-child { font-family: var(--mono); font-size: 16px; }
.pills { display: flex; gap: 6px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.up { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .dot.down { background: var(--bad); }
.hbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 16px; }
.hbtn:hover { border-color: var(--muted); }

/* ---------- layout ---------- */
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr) minmax(0, 1fr);
  /* One row that never grows past main: otherwise (notably in Safari) the row takes the feed's
     content height, the pane overflows the window and the feed's last items cannot be reached. */
  grid-template-rows: minmax(0, 1fr); gap: 12px; padding: 12px; min-height: 0; overflow: hidden; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.pane.antigen { border-top: 3px solid var(--antigen); }
.pane.antibody { border-top: 3px solid var(--antibody); }
.pane.binding { position: relative; }
.pane.binding::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--antigen), var(--antibody)); }
.phead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.phead h2 { margin: 0; font-size: 16px; letter-spacing: .02em; }
.phead h2 em { font-style: normal; color: var(--muted); letter-spacing: .02em; font-weight: 400; margin-left: 6px; }
.phead .sp { flex: 1; }
.feed { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.feed > * { flex: none; }
.feed::after { content: ""; flex: none; height: 1px; }   /* keeps the bottom padding scrollable in every engine */
.empty { color: var(--muted); text-align: center; margin: auto; font-size: 16px; max-width: 440px; }


/* ---------- command cards (side panes) ---------- */
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); overflow: hidden; }
.foldbatch { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cmdbatch { --batch-accent: var(--antigen); background: rgba(255, 92, 122, .035); }
.defbatch { --batch-accent: var(--antibody); background: rgba(56, 217, 196, .025); }
.foldbatch > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 14px; color: var(--muted); }
.foldbatch > summary::-webkit-details-marker { display: none; }
.foldbatch > summary::after { content: "▸"; margin-left: auto; color: var(--batch-accent); font-size: 17px; }
.foldbatch[open] > summary::after { content: "▾"; }
.foldbatch .cb-label { color: var(--batch-accent); font-weight: 600; white-space: nowrap; }
.foldbatch .cb-time, .foldbatch .cb-meta { white-space: nowrap; }
.foldbatch .cb-body { display: flex; flex-direction: column; gap: 10px; padding: 10px; border-top: 1px solid var(--line); }
.defbatch > summary { flex-wrap: wrap; }
.defbatch .cb-meta { white-space: normal; }
.card.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--warn); } 100% { box-shadow: 0 0 0 0 transparent; } }
.chead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 15px; color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chead .sp { flex: 1; }
.cmdline { font-family: var(--mono); font-size: 16px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.antigen .cmdline::before { content: "$ "; color: var(--antigen); }
.antibody .cmdline::before { content: "# "; color: var(--antibody); }
.out { margin: 0; padding: 8px 10px; font-family: var(--mono); font-size: 15px; white-space: pre-wrap; word-break: break-all;
  background: #050913; border-top: 1px dashed var(--line); color: #c9d4ea; }
/* No inner scroll box: a scrollable output inside the scrolling feed captures the wheel/trackpad
   (macOS latches a gesture to the inner box), so the feed seemed unable to reach its end. Long
   output is shortened instead, with an explicit "show all". */
.out .more, .cmdline .more { display: block; margin-top: 6px; font-family: var(--sans); }
.out.err { color: #ffb4b4; }
.out.collapsed { display: none; }
.badge { font-family: var(--mono); font-size: 14px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
.badge.ok { color: var(--ok); border-color: rgba(95, 211, 138, .4); }
.badge.bad { color: var(--bad); border-color: rgba(255, 107, 107, .4); }
.badge.run { color: var(--warn); border-color: rgba(244, 183, 64, .4); }
.badge.rej { color: var(--muted); text-decoration: line-through; }
.badge.op { color: var(--warn); }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 0; }
.linkbtn:hover { color: var(--text); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--warn); border-right-color: transparent; border-radius: 50%; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* records (right pane) */
.rec { border: 1px solid var(--line); border-left: 3px solid var(--antibody); border-radius: 10px; background: var(--bg2); padding: 8px 10px; }
.rec.decision { border-left-color: #8f9dff; }
.rec.decision.noint { border-left-color: var(--muted); }
.rec > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; font-size: 15px; min-width: 0; }
.rec > summary::-webkit-details-marker { display: none; }
.rec > summary .rt { color: var(--muted); white-space: nowrap; }
.rec > summary .rs { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rec > summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
.rec[open] > summary::after { content: "▾"; }
.rec[open] > summary .rs { white-space: normal; }
.rec .row { margin-top: 6px; }
.rec h4 { margin: 0 0 4px; font-size: 15px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.rec .row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 2px 8px; font-size: 16px; }
.rec .row b { color: var(--muted); font-weight: 500; font-size: 15px; }
.rec .row span { white-space: pre-line; overflow-wrap: anywhere; }
.num { display: inline-flex; flex: 0 0 24px; width: 24px; min-width: 24px; height: 24px; box-sizing: border-box; line-height: 1; border-radius: 50%; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #04141a; background: var(--antibody); }
.num.n2 { background: #8f9dff; } .num.n3 { background: #cfd8ea; }

.now { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--antibody-soft), transparent); }
.now div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.now small { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; letter-spacing: .08em; }
.now p { margin: 2px 0 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- center timeline ---------- */
/* The spine is drawn inside each batch body, so it no longer cuts through the folded
   batch summaries (it used to span the whole pane and strike through the header text). */
.tl .defbatch .cb-body { position: relative; }
.tl .defbatch .cb-body::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, var(--line) 6%, var(--line) 94%, transparent); pointer-events: none; z-index: 0; }
.tl .defbatch .cb-body > * { position: relative; z-index: 1; }
/* Opaque base under the translucent bubble tints, so the spine does not show through text. */
.tl .tli.defender .bub { background: linear-gradient(var(--antibody-soft), var(--antibody-soft)), #111a30; }
.tl .tli.obs .bub { background: linear-gradient(rgba(207, 216, 234, .06), rgba(207, 216, 234, .06)), #111a30; }
.tl .tli.obs .bub.elevated { background: linear-gradient(rgba(244, 183, 64, .10), rgba(244, 183, 64, .10)), #111a30; }
.tl .defbatch .cb-body .turnmark span { background: #111a30; }
/* Pinned (unbatched) Antigent items between batches. */
#feed-c > .turnmark { padding: 6px 0; }
#feed-c > .turnmark.trig { color: var(--antibody); }
.tli { display: flex; position: relative; }
.tli.attacker { justify-content: flex-start; } .tli.defender { justify-content: flex-end; }
.bub { max-width: 84%; min-width: 0; border-radius: 14px; padding: 7px 11px 6px; cursor: pointer; position: relative; }
.attacker .bub { background: var(--antigen-soft); border: 1px solid rgba(255, 92, 122, .35); border-top-left-radius: 4px; }
.defender .bub { background: var(--antibody-soft); border: 1px solid rgba(56, 217, 196, .35); border-top-right-radius: 4px; }
.bub:hover { filter: brightness(1.15); }
.bub code { font-family: var(--mono); font-size: 16px; white-space: pre-wrap; word-break: break-all; display: block; }
.bub .bm { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin-bottom: 3px; flex-wrap: wrap; }
.attacker .bub .who { color: var(--antigen); } .defender .bub .who { color: var(--antibody); }
.bub.rejected code { text-decoration: line-through; opacity: .6; }
.turndiv { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; color: var(--antibody); font-size: 14px; letter-spacing: .14em; font-weight: 600; }
.turndiv::before, .turndiv::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--antibody), transparent); opacity: .5; }
.turnmark { text-align: center; font-size: 14px; color: var(--muted); letter-spacing: .1em; }
/* v0.14: center = defender view (observed events -> Antigent actions) */
.tli.obs { justify-content: flex-start; }
.obs .bub { background: rgba(207, 216, 234, .06); border: 1px solid var(--line); border-top-left-radius: 4px; cursor: default; }
.obs .bub.elevated { border-color: var(--warn); background: rgba(244, 183, 64, .10); }
.rec.marker { border-left-color: var(--n3, #7ee0b8); background: rgba(126, 224, 184, .06); }
.rec.marker h4 { color: var(--n3, #7ee0b8); }
.rec.marker.fail { opacity: .6; border-style: dashed; background: var(--bg2); }
.rec.marker.used { border: 1px solid #ffd166; background: rgba(255, 209, 102, .14); box-shadow: 0 0 0 1px rgba(255,209,102,.3); }
.turnmark.hit { color: #ffd166; font-weight: 700; letter-spacing: .06em; padding: 6px 0; }
.turnmark.contained { color: var(--antibody); font-weight: 700; letter-spacing: .06em; padding: 6px 0; }
.turnmark.notcontained { color: var(--antigen); font-weight: 700; letter-spacing: .04em; padding: 6px 0; }
.tli.markerhit .bub { outline: 2px solid #ffd166; }
.obs .bub.raw { opacity: .7; padding: 3px 9px; }
.obs .bub.raw code { font-size: 14px; }
.obs .bub .who { color: var(--warn); } .obs .bub.raw .who { color: var(--muted); }
.kind { font-family: var(--mono); font-size: 13px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); }
.elevated .kind { border-color: var(--warn); color: var(--warn); }
body.hide-raw .obs .bub.raw { display: none; }
body.hide-raw .defbatch.rawonly { display: none; }
.pill.phase { color: var(--muted); }
.pill.phase.learning { color: var(--warn); border-color: rgba(244, 183, 64, .5); }
.pill.phase.stale { color: var(--antigen); }
.phead .dvtitle { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phead .dvtitle em { font-size: 12px; }
.phead .hbtn { padding: 2px 10px; font-size: 13px; line-height: 1.4; }   /* keep all pane headers one height */
.pill[hidden] { display: none; }
/* The Defender view shows only EXTERNAL-client telemetry, matching Antigent's observation
   boundary. Internal range-service events remain in the evidence stream but are not displayed. */
.tli.obs.internal { display: none; }
.turnmark.trig span { color: var(--antibody); }
.turnmark.fail span { color: var(--antigen); }
/* v0.16.3: the T0 briefing is Antigent's own activity -> shown in the Antigent (right) pane. */
.briefcard { margin: 2px 0 10px; padding: 8px 11px; border-left: 3px solid var(--antibody);
  background: var(--bg2); border-radius: 6px; color: var(--antibody); font-size: 14px; }
.briefcard.fail { border-left-color: var(--antigen); color: var(--antigen); }
.turnmark span { background: var(--panel); padding: 0 8px; position: relative; }


::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
@media (max-width: 1100px) {
  body { overflow: auto; }
  header { flex: none; }
  .meta { margin-left: 0; }
  main { flex: none; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; overflow: visible; }
  .pane { height: 520px; min-height: 0; }
  .phead { flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- antibody (Y) binding an antigen (spiked particle) -->
    <svg width="52" height="52" viewBox="0 0 40 40" aria-hidden="true">
      <g stroke="#38d9c4" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M20 37V22"/><path d="M20 22L11 12"/><path d="M20 22L29 12"/>
        <path d="M14.5 26L8 18.5" stroke-width="2" opacity=".6"/><path d="M25.5 26L32 18.5" stroke-width="2" opacity=".6"/>
      </g>
      <g transform="translate(9 9)">
        <circle r="4.2" fill="#ff5c7a"/>
        <g stroke="#ff5c7a" stroke-width="1.6" stroke-linecap="round">
          <path d="M0-6.5V-8.5"/><path d="M-6.5 0H-8.5"/><path d="M-4.6-4.6L-6-6"/><path d="M4.6-4.6L6-6"/><path d="M-4.6 4.6L-6 6"/>
        </g>
      </g>
    </svg>
    <div>
      <h1><span class="a">Anti</span><span class="b">gent</span></h1>
    </div>
  </div>
  <div class="meta">
    <div class="kv"><span>Scenario</span><span id="h-scn">–</span></div>
    <div class="kv"><span>Session</span><span id="h-ses">–</span></div>
    <div class="kv"><span>Elapsed</span><span id="h-el">00:00</span></div>
    <div class="kv"><span>Turn</span><span id="h-turn">0</span></div>
    <div class="kv"><span>Cmds A / D</span><span id="h-cnt">0 / 0</span></div>
    <div class="kv"><span>Events E / R</span><span id="h-ev">0 / 0</span></div>
    <div class="kv" title="Honeytokens used by the attacker / planted"><span>Decoys ✓ / ●</span><span id="h-decoy">0 / 0</span></div>
    <span class="pill phase" id="h-phase" hidden></span>
    <div class="pills" id="h-targets"></div>
    <button class="hbtn" id="b-export" title="Download this session as JSONL">Export</button>
    <button class="hbtn" id="b-reset" title="Start a new session">New session</button>
  </div>
</header>

<main>
  <!-- LEFT: attacker (antigen) -->
  <section class="pane antigen">
    <div class="phead">
      <h2 style="color:var(--antigen)">Attacker</h2>
    </div>
    <div class="feed" id="feed-a"></div>
  </section>

  <!-- CENTER: binding timeline -->
  <section class="pane binding">
    <div class="phead">
      <h2 class="dvtitle">Defender view<em id="h-internal" title="Traffic between the lab's own services (e.g. Jenkins polling Gitea, setup scripts). Never shown: it is outside what Antigent watches."></em></h2>
      <button class="hbtn" id="b-raw" title="raw: low-level requests from EXTERNAL clients (ordinary log lines, no alert). Off = show only notable events.">raw: on</button>
    </div>
    <div class="feed tl" id="feed-c"></div>
  </section>

  <!-- RIGHT: antigent (antibody) -->
  <section class="pane antibody">
    <div class="phead">
      <h2 style="color:var(--antibody)">Antigent</h2>
    </div>
    <div class="feed" id="feed-d"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtT = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
const S = { commands: new Map(), records: [], started: null, turn: 0, ev: { elevated: 0, raw: 0, internal: 0 }, seenObs: new Set(), markers: new Map(), attackBatch: null, attackBatchSeq: 0, defenderBatch: null, defenderBatchSeq: 0, bulkLoading: false };
const ATTACK_BATCH_GAP_SEC = 2;
const DEFENDER_BATCH_GAP_SEC = 2;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
}

/* ---------- render: side-pane command card ---------- */
function statusBadge(c) {
  if (c.status === "rejected") return el("span", "badge rej", "rejected");
  if (c.status === "running" || c.status === "queued") { const b = el("span", "badge run"); b.append(el("span", "spin"), " running"); return b; }
  if (c.exit_code == null) return el("span", "badge op", "logged");
  return el("span", "badge " + (c.exit_code === 0 ? "ok" : "bad"), "exit " + c.exit_code);
}
const OUT_HEAD_LINES = 30, OUT_HEAD_CHARS = 3000;   // command output, once shown
const CMD_HEAD_LINES = 6, CMD_HEAD_CHARS = 600;      // the command itself (heredocs, scripts)
function foldText(cls, text, maxLines, maxChars, tag = "div") {
  // Full height, no inner scroll box (it would capture the feed's scrolling); long text starts
  // folded with an explicit toggle.
  const box = el(tag, cls);
  let head = text.split("\n").slice(0, maxLines).join("\n");
  if (head.length > maxChars) head = head.slice(0, maxChars);
  if (head.length >= text.length) { box.textContent = text; return box; }
  const rest = text.slice(head.length), restLines = Math.max(1, rest.split("\n").length - (rest.startsWith("\n") ? 1 : 0));
  const more = el("button", "linkbtn more");
  let open = false;
  const render = () => {
    box.textContent = open ? text : head;
    more.textContent = open ? "fold" : "… " + restLines + " more line" + (restLines === 1 ? "" : "s") + " · show all";
    box.append(more);
  };
  more.onclick = (ev) => { ev.stopPropagation(); open = !open; render(); };
  render();
  return box;
}
function outBlock(cls, text) { return foldText(cls, text, OUT_HEAD_LINES, OUT_HEAD_CHARS, "pre"); }
function cardFor(c) {
  const card = el("div", "card"); card.id = "card-" + c.id;
  const h = el("div", "chead");
  h.append(el("span", null, (c.side === "attacker" && c.turn ? "#" + c.turn + " · " : c.turn ? "T" + c.turn + " · " : "") + fmtT(c.created)));
  if (c.via) h.append(el("span", "badge op", "via " + c.via));
  h.append(el("span", "sp"));
  if (c.duration != null) h.append(el("span", null, c.duration + "s"));
  h.append(statusBadge(c));
  card.append(h);
  card.append(foldText("cmdline", c.command || "", CMD_HEAD_LINES, CMD_HEAD_CHARS));
  if (c.status === "done") {
    const hasOut = (c.stdout || "").length, hasErr = (c.stderr || "").length;
    const tog = el("div", "chead"); tog.style.borderBottom = "0"; tog.style.borderTop = "1px solid var(--line)";
    tog.append(el("span", null, "response · " + (hasOut ? hasOut + " B stdout" : "no stdout") + (hasErr ? " · " + hasErr + " B stderr" : "") + (c.truncated ? " · truncated" : "")));
    tog.append(el("span", "sp"));
    const tb = el("button", "linkbtn", "show"); tog.append(tb); card.append(tog);
    const outs = [];
    if (hasOut) outs.push(outBlock("out", c.stdout));
    if (hasErr) outs.push(outBlock("out err", c.stderr));
    if (!hasOut && !hasErr) outs.push(el("pre", "out", "(no output)"));
    outs.forEach((o) => { o.classList.add("collapsed"); card.append(o); });

  loading = (async () => {
    pending = [];
    const st = await api("/api/state");
    // A reload (stream reconnect, new data) keeps each pane where the reader left it; only the
    // first load, or a pane that was following the bottom, starts at the latest item.
    const keep = {};
    if (S.loadedOnce) for (const f of ["#feed-a", "#feed-c", "#feed-d"]) {
      const x = $(f); keep[f] = x.scrollHeight - x.scrollTop - x.clientHeight < 60 ? null : x.scrollTop;
    }
    resetDom();
    S.bulkLoading = true;
    S.replay = !!st.config.replay; S.runFirst = null; S.runLast = null;
    $("#b-reset").hidden = !!st.config.imported;   // offline review of an export: nothing to reset
    S.started = st.started;
    $("#h-ses").textContent = st.session.slice(9); $("#h-scn").textContent = st.config.scenario;
    const items = [...st.commands.map((c) => ({ t: c.created, c })), ...st.records.map((r) => ({ t: r.created, r })),
      ...(st.observed || []).map((o) => ({ t: o.ts, o })), ...(st.triggers || []).map((d) => ({ t: d.ts, d })),
      ...(st.outcomes || []).map((k) => ({ t: k.ts, k }))].sort((x, y) => x.t - y.t);
    for (const it of items) {
      trackRunSpan(it.t);
      it.c ? upsertCommand(it.c) : it.r ? addRecord(it.r) : it.o ? addObserved(it.o) : it.k ? addContainment(it.k) : addTrigger(it.d);
    }
    S.bulkLoading = false;
    for (const f of ["#feed-a", "#feed-c", "#feed-d"]) $(f).scrollTop = keep[f] == null ? $(f).scrollHeight : keep[f];
    S.loadedOnce = true;
    updateHeader(); tickElapsed();
    if (S.lastSensor) showPhase(S.lastSensor);   // panes were just rebuilt
  })();
  try { await loading; } finally {
    loading = null;
    const queued = pending; pending = [];
    if (queued.some((ev) => ev.type === "session")) load();   // new session during the snapshot
    else for (const ev of queued) applyEvent(ev);
  }
}
let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  // Re-sync on every (re)connect: events published while disconnected are not replayed
  // by the server, so a plain reconnect used to leave permanent gaps in the panes.
  es.onopen = () => { S.disconnected = false; load(); };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch (_) { return; }
    if (loading) { pending.push(ev); return; }
    applyEvent(ev);
  };
  es.onerror = () => {
    // Server gone (e.g. `docker compose down`): say so and stop the clock, instead of a
    // frozen page whose Elapsed keeps counting as if the run were still going.
    S.disconnected = true;
    const box = $("#h-phase");
    if (box) { box.textContent = "console disconnected"; box.className = "pill phase stale"; box.hidden = false; }
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
}
function showPhase(sn) {
  // Tell the operator what is happening while the panes are legitimately empty.
  const p = (sn && sn.phase) || "off";
  S.phase = p; S.lastSensor = sn;
  const txt = {
    starting: "sensor starting",
    stale: "sensor not responding",
    learning: "learning baseline " + Math.round(sn.elapsed_sec || 0) + " / " + Math.round(sn.duration_sec || 0) + " s",
    watching: "watching",
  }[p];
  const box = $("#h-phase");
  if (box) { box.textContent = txt || ""; box.className = "pill phase " + p; box.hidden = !txt; }
  const c = $("#feed-c .empty");
  if (c && p === "learning") c.textContent = "Learning the baseline (" + Math.round(sn.elapsed_sec || 0) + " / "
    + Math.round(sn.duration_sec || 0) + " s). Activity in this window is recorded as normal and not shown here.";
  else if (c && p === "starting") c.textContent = "Waiting for the sensor to start.";
  else if (c && p === "stale") c.textContent = "The sensor has stopped writing status (is the antigent container running?).";
  else if (c && p === "watching") updateHeader();
  const a = $("#feed-a .empty");
  if (a && (p === "learning" || p === "starting")) a.textContent = "No attacker commands yet. The Attack Box starts after the "
    + "baseline; its first build can take several minutes.";
}
async function health() {
  if (S.disconnected) return;
  try {
    const h = await api("/api/health");
    const ts = Array.isArray(h) ? h : (h.targets || []);
    showPhase(h.sensor);
    const box = $("#h-targets"); box.replaceChildren();
    for (const t of ts) { const p = el("span", "pill"); p.title = (t.container || "") + (t.status ? " → " + t.status : ""); p.append(el("span", "dot " + (t.up ? "up" : "down")), t.name); box.append(p); }
  } catch (e) { /* server down */ }
}
setInterval(tickElapsed, 1000);
setInterval(health, 5000);

/* ---------- controls ---------- */
$("#b-raw").onclick = (e) => { const hide = document.body.classList.toggle("hide-raw"); e.target.textContent = hide ? "raw: off" : "raw: on"; try { localStorage.setItem("antigent-hide-raw", hide ? "1" : "0"); } catch (_) {} };
try { if (localStorage.getItem("antigent-hide-raw") === "1") { document.body.classList.add("hide-raw"); $("#b-raw").textContent = "raw: off"; } } catch (_) {}
$("#b-export").onclick = () => { location.href = "/api/export"; };
$("#b-reset").onclick = async () => { if (confirm("Start a new session? The current log stays in runs/.")) await api("/api/reset", {}); };

connect();   // onopen performs the initial load()
health();
</script>
