<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475467"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d92d50"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0e9384"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b54708"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #101828; }
      .s { font-size: 12px; fill: #475467; }
      .h { font-size: 14px; font-weight: 700; }
      .l { font-size: 12px; fill: #344054; }
      .node { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.2; }
      .w { stroke: #475467; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="600" rx="14" fill="#ffffff"/>

  <!-- ===== Attacker plane ===== -->
  <rect x="20" y="40" width="210" height="420" rx="12" fill="#fff1f3" stroke="#f4a3b4" stroke-width="1.5"/>
  <text x="38" y="66" class="h" style="fill:#c01048">Attacker plane</text>
  <rect x="40" y="100" width="170" height="70" rx="9" class="node"/>
  <text x="125" y="130" class="t" text-anchor="middle">Attack Box</text>
  <text x="125" y="150" class="s" text-anchor="middle">attacker agent</text>
  <rect x="90" y="300" width="120" height="62" rx="9" class="node"/>
  <text x="150" y="326" class="t" text-anchor="middle">Egress proxy</text>
  <text x="150" y="345" class="s" text-anchor="middle">LLM API only</text>
  <path d="M150 170 V298" class="w" marker-end="url(#a)"/>
  <path d="M150 362 V402" class="w" marker-end="url(#a)"/>
  <text x="158" y="398" class="l">LLM API</text>

  <!-- ===== Target ===== -->
  <rect x="265" y="40" width="190" height="420" rx="12" fill="#fffaeb" stroke="#f5c96b" stroke-width="1.5"/>
  <text x="283" y="66" class="h" style="fill:#b54708">Target</text>
  <rect x="290" y="240" width="140" height="80" rx="9" class="node"/>
  <text x="360" y="272" class="t" text-anchor="middle">Target systems</text>
  <text x="360" y="292" class="s" text-anchor="middle">e.g. CI/CD Goat</text>

  <!-- attack -->
  <path d="M210 135 C 250 135, 250 265, 288 265" stroke="#d92d50" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <text x="222" y="120" class="l" style="fill:#c01048" font-weight="600">attack</text>

  <!-- ===== Defense plane ===== -->
  <rect x="490" y="40" width="530" height="420" rx="12" fill="#f0fdf9" stroke="#7fd6c2" stroke-width="1.5"/>
  <text x="508" y="66" class="h" style="fill:#107569">Defense plane</text>

  <!-- Scenario Adapter: pluggable, outside the scenario-agnostic core -->
  <rect x="664" y="80" width="328" height="54" rx="9" fill="#fffaeb" stroke="#b54708" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="828" y="103" class="t" text-anchor="middle">Scenario Adapter</text>
  <text x="828" y="122" class="s" text-anchor="middle">sensor rules · context · typed actions</text>
  <path d="M828 134 V162" stroke="#b54708" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#o)"/>

  <rect x="510" y="210" width="120" height="58" rx="9" class="node"/>
  <text x="570" y="236" class="t" text-anchor="middle">netsensor</text>
  <text x="570" y="254" class="s" text-anchor="middle">network taps</text>
  <rect x="510" y="310" width="120" height="58" rx="9" class="node"/>
  <text x="570" y="336" class="t" text-anchor="middle">socket-proxy</text>
  <text x="570" y="354" class="s" text-anchor="middle">Docker API allowlist</text>

  <!-- antigent-core (scenario-agnostic) -->
  <rect x="650" y="164" width="356" height="226" rx="11" fill="#ccfbef" fill-opacity=".45" stroke="#0e9384" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="664" y="184" class="s" font-weight="600" style="fill:#107569">antigent-core</text>

  <rect x="664" y="196" width="140" height="58" rx="9" class="node"/>
  <text x="734" y="222" class="t" text-anchor="middle">Driver</text>
  <text x="734" y="240" class="s" text-anchor="middle">schedules turns</text>
  <rect x="830" y="196" width="162" height="58" rx="9" fill="#0e9384"/>
  <text x="911" y="222" class="t" text-anchor="middle" style="fill:#ffffff">Antigent</text>
  <text x="911" y="240" class="s" text-anchor="middle" style="fill:#e6fffa">AGENTS.md + skills</text>

  <rect x="664" y="314" width="140" height="58" rx="9" class="node"/>
  <text x="734" y="340" class="t" text-anchor="middle">Sensor</text>
  <text x="734" y="358" class="s" text-anchor="middle">logs · diff · net</text>
  <rect x="830" y="314" width="162" height="58" rx="9" class="node"/>
  <text x="911" y="340" class="t" text-anchor="middle">Defense Gateway</text>
  <text x="911" y="358" class="s" text-anchor="middle">MCP tools</text>

  <!-- telemetry -->
  <path d="M430 265 C 470 265, 470 239, 508 239" class="w" marker-end="url(#a)"/>
  <path d="M430 295 C 470 295, 470 339, 508 339" class="w" marker-end="url(#a)"/>
  <text x="444" y="230" class="l">traffic</text>
  <text x="440" y="372" class="l">logs · diff</text>
  <path d="M630 239 C 648 239, 646 332, 662 332" class="w" marker-end="url(#a)"/>
  <path d="M630 343 H662" class="w" marker-end="url(#a)"/>
  <path d="M734 314 V256" class="w" marker-end="url(#a)"/>
  <text x="741" y="290" class="l">events</text>
  <path d="M804 225 H828" class="w" marker-end="url(#a)"/>
  <path d="M804 343 H828" class="w" marker-end="url(#a)"/>
  <path d="M911 256 V312" class="w" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="918" y="290" class="l">MCP</text>

  <!-- response -->
  <path d="M911 372 V420 H360 V322" stroke="#0e9384" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="372" y="412" class="l" style="fill:#107569" font-weight="600">typed actions (decoy · containment)</text>

  <!-- ===== Console ===== -->
  <rect x="580" y="500" width="200" height="62" rx="9" class="node"/>
  <text x="680" y="536" class="t" text-anchor="middle">Console</text>
  <path d="M700 390 V498" class="w" marker-end="url(#a)"/>
  <text x="708" y="470" class="l">event log</text>
  <path d="M60 170 V531 H578" stroke="#d92d50" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="76" y="522" class="l" style="fill:#c01048">attacker command log</text>
</svg>
